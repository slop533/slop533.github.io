<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>@shitivibecoded</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=Hanken+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a single narrow left-aligned column; name and one-line intro up top, then quiet label/value rows. */
:root {
  --bg: #f6f7f9;
  --fg: #16181d;
  --muted: #5d6471;
  --line: #dfe2e8;
  --accent: #2b4bd6;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216;
    --fg: #eceef2;
    --muted: #98a0ae;
    --line: #262a32;
    --accent: #8ea2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216;
  --fg: #eceef2;
  --muted: #98a0ae;
  --line: #262a32;
  --accent: #8ea2ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  padding-block: 72px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px; }

.label {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

header { display: flex; flex-direction: column; gap: 20px; }
h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(40px, 9vw, 60px);
  line-height: 1.02;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.intro { font-size: 21px; line-height: 1.45; color: var(--fg); margin: 0; max-width: 34ch; text-wrap: pretty; }

section { display: flex; flex-direction: column; gap: 16px; }
section p { margin: 0; color: var(--fg); max-width: 62ch; }
section p + p { margin-top: 0; }

dl { margin: 0; display: grid; grid-template-columns: 8.5rem 1fr; border-top: 1px solid var(--line); }
dt, dd { margin: 0; padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
dt { color: var(--muted); font-size: 15px; }
dd { overflow-wrap: anywhere; }

ul.links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
ul.links li { border-bottom: 1px solid var(--line); }
ul.links a {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 14px 0; color: var(--fg); text-decoration: none;
}
ul.links a span:last-child { font-family: var(--font-mono); font-size: 13px; color: var(--muted); transition: color .15s, transform .15s; }
ul.links a:hover span:first-child, ul.links a:focus-visible span:first-child { color: var(--accent); }
ul.links a:hover span:last-child, ul.links a:focus-visible span:last-child { color: var(--accent); transform: translateX(3px); }
ul.projects { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
ul.projects li { border-bottom: 1px solid var(--line); }
ul.projects a { display: flex; flex-direction: column; gap: 2px; padding: 16px 0; color: var(--fg); text-decoration: none; }
ul.projects .p-name { font-family: var(--font-display); font-weight: 500; font-size: 20px; letter-spacing: -0.01em; transition: color .15s; }
ul.projects .p-desc { color: var(--muted); font-size: 15px; }
ul.projects a:hover .p-name, ul.projects a:focus-visible .p-name { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

footer { padding-top: 8px; font-size: 13px; color: var(--muted); }

@media (max-width: 480px) {
  body { font-size: 16px; padding-block: 48px 72px; }
  main { gap: 44px; }
  .intro { font-size: 19px; }
  dl { grid-template-columns: 1fr; }
  dt { padding-bottom: 0; border-bottom: 0; font-size: 13px; }
  dd { padding-top: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<main>
  <header>
    <span class="label">Hello, I'm</span>
    <h1>@shitivibecoded</h1>
    <p class="intro">account + website for stuff i vibecoded</p>
  </header>

  <section>
    <span class="label">Projects</span>
    <ul class="projects">
      <li><a href="https://github.com/slop533/miimixer" target="_blank" rel="noopener"><span class="p-name">miimixer</span><span class="p-desc">A GitHub project for mixing Miis.</span></a></li>
    </ul>
  </section>

  <section>
    <span class="label">Elsewhere</span>
    <ul class="links">
      <li><a href="https://x.com/shitivibecoded" target="_blank" rel="noopener"><span>Twitter</span><span>@shitivibecoded ↗</span></a></li>
      <li><a href="https://github.com/slop533" target="_blank" rel="noopener"><span>GitHub</span><span>slop533 ↗</span></a></li>
    </ul>
  </section>

  <footer>© 2026 @shitivibecoded</footer>
</main>

</body>
</html>
